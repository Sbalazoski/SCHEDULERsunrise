[build]
  publish = "public"
  command = "node init-db.js"
  functions = "netlify/functions"

[functions]
  included_files = ["scheduler.sql.js"]

[functions.node_modules]
  external_node_modules = ["sql.js"]

[[redirects]]
  from = "/api/*"
  to = "/.netlify/functions/api"
  status = 200
  force = true